<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>AJ</title>
<style>
  :root{--bg:#0f1115;--fg:#e6e6e6;--dim:#8b93a1;--me:#1f6feb;--aj:#1b2029;--ok:#3fb950;--bad:#f85149}
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.6 -apple-system,"PingFang SC",system-ui,sans-serif;
       display:flex;flex-direction:column;height:100dvh}
  header{padding:10px 14px;border-bottom:1px solid #232833;display:flex;align-items:center;gap:8px;font-size:13px;color:var(--dim)}
  header b{color:var(--fg);font-size:15px}
  #log{flex:1;overflow-y:auto;padding:14px;display:flex;flex-direction:column;gap:10px}
  .row{max-width:92%;padding:9px 12px;border-radius:12px;white-space:pre-wrap;word-break:break-word}
  .me{align-self:flex-end;background:var(--me);color:#fff;border-bottom-right-radius:4px}
  .aj{align-self:flex-start;background:var(--aj);border-bottom-left-radius:4px}
  .tool{align-self:flex-start;background:#151a22;border:1px solid #232833;color:var(--dim);font:12px/1.5 ui-monospace,Menlo,monospace;max-width:96%}
  .err{color:var(--bad)}
  .ok{color:var(--ok)}
  footer{border-top:1px solid #232833;padding:10px;display:flex;gap:8px;padding-bottom:calc(10px + env(safe-area-inset-bottom))}
  textarea{flex:1;resize:none;height:46px;max-height:140px;background:#161b22;color:var(--fg);border:1px solid #262c36;
           border-radius:10px;padding:11px 12px;font:15px/1.4 inherit;outline:none}
  button{background:var(--me);color:#fff;border:0;border-radius:10px;padding:0 18px;font-size:15px;font-weight:600}
  button:disabled{opacity:.5}
  .hint{color:var(--dim);font-size:12px;padding:6px 14px}
</style>
</head>
<body>
<header><b>AJ</b><span id="st">在线</span></header>
<div id="log"></div>
<div class="hint">直接说要做什么。它能在这台手机的沙箱里跑命令。</div>
<footer>
  <textarea id="q" placeholder="说点什么…（Enter 发送，Shift+Enter 换行）"></textarea>
  <button id="go">发送</button>
</footer>
<script>
const log=document.getElementById('log'), q=document.getElementById('q'), go=document.getElementById('go'), st=document.getElementById('st');
const KEY='ajweb_hist';
let hist = JSON.parse(localStorage.getItem(KEY)||'[]');
function tok(){
  const u=new URL(location.href);
  if(u.searchParams.get('k')){ localStorage.setItem('ajtoken',u.searchParams.get('k')); u.searchParams.delete('k'); history.replaceState(null,'',u.toString()); }
  return localStorage.getItem('ajtoken')||'';
}
function bubble(cls,txt){
  const d=document.createElement('div'); d.className='row '+cls; d.textContent=txt; log.appendChild(d);
  log.scrollTop=log.scrollHeight; return d;
}
function render(){ log.innerHTML=''; for(const m of hist){ bubble(m.role==='user'?'me':'aj', m.content); } }
render();
async function send(){
  const text=q.value.trim(); if(!text) return;
  q.value=''; hist.push({role:'user',content:text}); bubble('me',text);
  go.disabled=true; st.textContent='思考中…';
  try{
    const r=await fetch('/api/chat',{method:'POST',headers:{'Content-Type':'application/json','X-AJ-Token':tok()},
      body:JSON.stringify({text, history:hist.slice(-12,-1)})});
    const j=await r.json();
    if(j.error){ bubble('aj err','错误：'+j.error); }
    else{
      for(const e of (j.events||[])){
        if(e.t==='sh') bubble('tool','$ '+e.v);
        else if(e.t==='out') bubble('tool',e.v);
        else if(e.t==='answer'){ bubble('aj',e.v); hist.push({role:'assistant',content:e.v}); }
      }
      if(!(j.events||[]).some(e=>e.t==='answer')) bubble('aj','（没有拿到回答）');
    }
  }catch(e){ bubble('aj err','连不上：'+e.message); }
  go.disabled=false; st.textContent='在线';
  localStorage.setItem(KEY,JSON.stringify(hist.slice(-40)));
}
go.onclick=send;
q.addEventListener('keydown',e=>{ if(e.key==='Enter'&&!e.shiftKey){ e.preventDefault(); send(); }});
</script>
</body>
</html>
