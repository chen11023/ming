name: Build APK

permissions:
  contents: write

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      # ---------- 0. 固定签名（不提交私钥，从 Secret 解出来） ----------
      # 没有这个 Secret 时跳过，退回默认 debug 签名（只是不能覆盖安装）
      - name: Decode signing key
        run: |
          if [ -n "${{ secrets.AJ_KEYSTORE_B64 }}" ]; then
            echo "${{ secrets.AJ_KEYSTORE_B64 }}" | base64 -d > app/aj.jks
            ls -l app/aj.jks
          else
            echo "no secret, use default debug signing"
          fi

      # ---------- 1. 静态 proot（aarch64，无动态依赖） ----------
      - name: Fetch static proot
        run: |
          set -e
          mkdir -p app/src/main/jniLibs/arm64-v8a
          URL="https://github.com/proot-me/proot/releases/download/v5.3.0/proot-v5.3.0-aarch64-static"
          for TRY in "$URL" "https://ghproxy.net/$URL" "https://gh-proxy.com/$URL"; do
            echo "try: $TRY"
            if curl -fsSL --retry 2 --max-time 120 -o /tmp/proot "$TRY"; then
              if [ "$(stat -c%s /tmp/proot)" -gt 500000 ]; then break; fi
            fi
          done
          file /tmp/proot
          cp /tmp/proot app/src/main/jniLibs/arm64-v8a/libproot.so
          chmod 755 app/src/main/jniLibs/arm64-v8a/libproot.so
          ls -la app/src/main/jniLibs/arm64-v8a/

      # ---------- 2. Alpine rootfs ----------
      - name: Fetch Alpine rootfs
        run: |
          set -e
          mkdir -p app/src/main/assets
          curl -fsSL --retry 3 -o /tmp/alpine.tar.gz \
            "https://dl-cdn.alpinelinux.org/alpine/v3.22/releases/aarch64/alpine-minirootfs-3.22.6-aarch64.tar.gz"
          ls -la /tmp/alpine.tar.gz

      # ---------- 3. 往 rootfs 里预装常用包（跨架构安装） ----------
      - name: Preinstall packages into rootfs
        continue-on-error: true
        run: |
          set -e
          sudo apt-get update -qq
          sudo apt-get install -y -qq apk-tools || true

          # 优先用 alpine 官方 apk 静态二进制做跨架构安装
          curl -fsSL -o /tmp/apk.static \
            "https://dl-cdn.alpinelinux.org/alpine/v3.22/main/x86_64/apk-tools-static-2.14.12-r0.apk" || true
          if [ -s /tmp/apk.static ]; then
            mkdir -p /tmp/apkx && tar xzf /tmp/apk.static -C /tmp/apkx 2>/dev/null || true
            APK=$(find /tmp/apkx -name "apk.static" -o -name "apk" -type f | head -1)
            echo "apk: $APK"
            if [ -n "$APK" ]; then
              mkdir -p /tmp/rootfs
              sudo tar xzf /tmp/alpine.tar.gz -C /tmp/rootfs || tar xzf /tmp/alpine.tar.gz -C /tmp/rootfs
              # 逐个装，某个包名不存在时只跳过它，不整体失败
              for pkg in bash python3 curl git nano \
                         py3-pillow py3-matplotlib py3-numpy py3-openpyxl \
                         py3-pdfminer ffmpeg poppler-utils font-noto-cjk; do
                echo "=== install $pkg"
                sudo "$APK" --root /tmp/rootfs --arch aarch64 \
                  --repository https://dl-cdn.alpinelinux.org/alpine/v3.22/main \
                  --repository https://dl-cdn.alpinelinux.org/alpine/v3.22/community \
                  --allow-untrusted --no-cache add "$pkg" 2>&1 | tail -3 || echo "skip $pkg"
              done
              sudo mkdir -p /tmp/rootfs/var/lib/apk /tmp/rootfs/var/cache/apk \
                             /tmp/rootfs/var/cache/fontconfig /tmp/rootfs/var/tmp
              sudo chmod 1777 /tmp/rootfs/var/tmp
              echo "--- installed:"; ls /tmp/rootfs/usr/bin | tr '\n' ' ' | head -c 2000
              ls /tmp/rootfs/usr/bin/python3* 2>/dev/null || echo "python3 未装入（不影响启动）"
              tar czf app/src/main/assets/rootfs.tar.gz -C /tmp/rootfs . || true
              ls -la app/src/main/assets/
            fi
          fi

          # 上一步没成功就用原始 minirootfs
          if [ ! -s app/src/main/assets/rootfs.tar.gz ]; then
            cp /tmp/alpine.tar.gz app/src/main/assets/rootfs.tar.gz
          fi
          ls -la app/src/main/assets/

      # ---------- 4. 编译 ----------
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.7'

      - name: Build debug APK
        env:
          BUILD_NUMBER: ${{ github.run_number }}
          BUILD_TAG: ${{ github.sha }}
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Rename APK with build tag
        run: |
          set -e
          cd app/build/outputs/apk/debug
          SHORT=$(echo "$GITHUB_SHA" | cut -c1-8)
          for f in *.apk; do
            [ "$f" = "aj-mini-r${GITHUB_RUN_NUMBER}-${SHORT}.apk" ] && continue
            mv "$f" "aj-mini-r${GITHUB_RUN_NUMBER}-${SHORT}.apk"
          done
          ls -la

      - name: Publish release (给 App 内自更新用)
        continue-on-error: true
        uses: softprops/action-gh-release@v2
        with:
          tag_name: r${{ github.run_number }}
          name: r${{ github.run_number }}
          body: "自动构建 r${{ github.run_number }} (${{ github.sha }})"
          files: app/build/outputs/apk/debug/*.apk
          fail_on_unmatched_files: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: aj-mini-debug
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 30
